<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1D3461"/>
      <stop offset="100%" stop-color="#00A651"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Subtle top highlight for depth -->
  <rect width="32" height="16" rx="7" fill="url(#shine)"/>

  <!-- TCA text -->
  <text
    x="16"
    y="16.5"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="11.5"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="0.4"
  >TCA</text>
</svg>
